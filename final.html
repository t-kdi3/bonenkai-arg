<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>最後の課題</title>

<link rel="stylesheet" href="css/style.css">

</head>
<body>

<div class="container">

<div class="page-card">

<h1>🏆 最後の課題 🏆</h1>

<p>

ここまでの課題で、
さまざまな文字を集めてきました。

</p>

<h2>取得済みキーワード</h2>

<div
id="keywordArea"
class="keyword-progress">
</div>

<p>

取得したキーワードを並び替え、
さらに

<strong>
あなたの今の気持ちになるように
2文字追加して
</strong>

カタカナで入力してください。

</p>

<p>
ヒント：
学校行事が終わったあとの
気持ちかもしれません。
</p>

<br>

<input
id="answer"
placeholder="カタカナで入力">

<br><br>

<button onclick="checkAnswer()">
回答する
</button>

<br><br>

<button
class="back-btn"
onclick="location.href='start.html'">
課題選択へ戻る
</button>

</div>

</div>

<script>

function showKeywords(){

    const history = JSON.parse(
        localStorage.getItem(
            "keywordHistory"
        ) || "[]"
    );

    let html = "";

    if(history.length === 0){

        html =
        "<p>まだキーワードを取得していません。</p>";

    }else{

        history.forEach(char => {

            html += `
            <span class="keyword owned">
                ${char}
            </span>
            `;

        });

    }

    document.getElementById(
        "keywordArea"
    ).innerHTML = html;
}

function checkAnswer(){

    const ans =
    document.getElementById(
        "answer"
    )
    .value
    .trim()
    .replace(/\s/g,"");

    if(
        ans ===
        "ボウネンカイタノシイ"
    ){

        location.href =
        "ending.html";

    }else{

        alert(
            "違うようです。もう一度考えてみましょう。"
        );

    }

}

document
.getElementById("answer")
.addEventListener(
    "keypress",
    function(e){

        if(
            e.key === "Enter"
        ){
            checkAnswer();
        }

    }
);

showKeywords();

</script>

</body>
</html>
