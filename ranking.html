<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<title>個人ランキング</title>

<style>
.rank-gold{color:#d4af37;font-weight:bold;}
.rank-silver{color:#808080;font-weight:bold;}
.rank-bronze{color:#8c6239;font-weight:bold;}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#1e3a5f;
    color:white;
}

tr:nth-child(even){
    background:#f5f5f5;
}
</style>
</head>

<body>

<div class="container">

    <div class="page-card">

        <h1>🏆 個人ランキング 🏆</h1>

        <p>
            忘年会ARG リアルタイム順位表
        </p>

        <table id="rankingTable">
            <thead>
                <tr>
                    <th>順位</th>
                    <th>名前</th>
                    <th>タイム</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>

        <br>

        <button onclick="location.href='index.html'">
            トップへ戻る
        </button>

    </div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwOvRHsxmXHXbZ3yZ9HY8dQ3c6ZalGXN-h9rWqXcXgDM9MP-5UX6WU0lBfmiQEE20hK/exec";

function secToText(sec){

    const min =
        Math.floor(sec / 60);

    const remain =
        sec % 60;

    return `${min}分${remain}秒`;
}

async function loadRanking(){

    try{

        const response =
            await fetch(API_URL);

        const data =
            await response.json();

        const tbody =
            document.querySelector(
                "#rankingTable tbody"
            );

        tbody.innerHTML = "";

        data.forEach(
            (player,index)=>{

                let cls = "";

                if(index === 0){
                    cls = "rank-gold";
                }else if(index === 1){
                    cls = "rank-silver";
                }else if(index === 2){
                    cls = "rank-bronze";
                }

                tbody.innerHTML += `
                <tr class="${cls}">
                    <td>${index + 1}</td>
                    <td>${player.name}</td>
                    <td>${secToText(player.time)}</td>
                </tr>`;
            }
        );

    }catch(e){

        console.error(e);

        document.querySelector(
            "#rankingTable tbody"
        ).innerHTML =
        `<tr>
            <td colspan="3">
                ランキング取得失敗
            </td>
        </tr>`;
    }
}

loadRanking();

setInterval(
    loadRanking,
    30000
);

</script>

</body>
</html>
