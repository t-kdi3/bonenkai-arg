<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/style.css">
<script src="js/common.js"></script>
<title>情報クリア</title>
</head>

<body class="it">

<div class="container">

<div class="page-card">

<h2>💻 情報の挑戦クリア！ 💻</h2>

<p class="success-text">
あなたは個人情報を守り抜くことができました。
</p>

<h3>今回の課題のポイント</h3>

<div class="info-box">

<p>
近年はSNSやメール、Webサイトなどを利用した
個人情報の流出やフィッシング詐欺が問題となっています。
</p>

<p>
攻撃者は「急いでください」「今すぐ入力してください」など、
相手を焦らせることで冷静な判断をできなくさせようとします。
</p>

<p>
本当に信頼できる相手なのか、
なぜその情報が必要なのかを確認し、
慌てて入力しないことが大切です。
</p>

</div>

<h3>獲得したキーワード</h3>

<div class="keyword-box">
ノ
</div>

<p>
この文字を忘れずにメモしておこう！
</p>

<button onclick="saveClear('it');goStart();">
課題選択へ戻る
</button>

</div>

</div>

</body>
</html>
