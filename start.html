<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/style.css">
<title>課題選択</title>
<script src="js/common.js"></script>
</head>

<body>

<div class="container">

<div class="page-card">

<h1>課題選択</h1>

<p id="playerName"></p>

<div id="timer"></div>

<div class="button-grid">

<button onclick="location.href='art.html'">
🎨 美術
</button>

<button onclick="location.href='calligraphy.html'">
🖌️ 書道
</button>

<button onclick="location.href='music.html'">
🎵 音楽
</button>

<button onclick="location.href='home.html'">
🍳 家庭科
</button>

<button onclick="location.href='nurse.html'">
💊 養護
</button>

<button onclick="location.href='office.html'">
🗂️ 事務
</button>

<button onclick="location.href='library.html'">
📚 司書
</button>

<button onclick="location.href='it.html'">
💻 情報
</button>

</div>

<hr>

<h2>最終課題</h2>

<p>
手がかりが集まったと思ったら、
「最後の課題」と入力して挑戦できます。
</p>

<input
id="finalInput"
placeholder="最後の課題">

<button onclick="checkFinal()">
挑戦する
</button>

</div>

</div>

<script>

document.getElementById("playerName").textContent =
"挑戦者：" +
(localStorage.getItem("playerName") || "名無し");

function checkFinal(){

    const word =
        document.getElementById(
            "finalInput"
        )
        .value
        .trim();

    if(
        word === "最後の課題" ||
        word === "さいごのかだい"
    ){
        location.href="final.html";
        return;
    }

    alert(
        "「最後の課題」と入力してください。"
    );

}

/* タイマー */

function updateTimer(){

    const start =
        Number(
            localStorage.getItem(
                "startTime"
            )
        );

    if(!start) return;

    const sec =
        Math.floor(
            (Date.now()-start)/1000
        );

    const m =
        Math.floor(sec/60);

    const s =
        sec%60;

    document.getElementById(
        "timer"
    ).textContent =
    "経過時間 "
    + m + "分"
    + s + "秒";

}

updateTimer();

setInterval(
    updateTimer,
    1000
);

</script>

</body>
</html>
