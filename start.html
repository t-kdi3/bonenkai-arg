<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>課題選択</title>

<link rel="stylesheet" href="css/style.css">
<script src="js/common.js"></script>

</head>
<body>

<div class="container">

<div class="page-card">

<h1>課題選択</h1>

<p id="playerName" class="player-name"></p>

<div id="timer"></div>

<h2>挑戦できる課題</h2>

<div id="subjectArea" class="button-grid"></div>

<hr>

<h2>🏆 最後の課題</h2>

<p>
手がかりが集まったと思ったら、
「最後の課題」と入力して挑戦できます。
</p>

<input
id="finalInput"
placeholder="最後の課題">

<br><br>

<button onclick="checkFinal()">
挑戦する
</button>

<hr>

<details>

<summary>
進行状況・取得キーワードを見る
</summary>

<h2>進行状況</h2>

<div
id="progressArea"
class="progress-box">
</div>

<h2>取得したキーワード</h2>

<div
id="keywordArea"
class="keyword-progress">
</div>

</details>

</div>

</div>

<script>

/* ------------------------
   挑戦者名表示
------------------------ */

const personalName =
    localStorage.getItem("personalName") ||
    "";

document.getElementById(
    "playerName"
).textContent =
    personalName
    ? `挑戦者：${personalName}`
    : "";

/* ------------------------
   課題一覧
------------------------ */

const subjects = [

{
    key:"art",
    title:"🎨 美術",
    file:"art.html"
},

{
    key:"calligraphy",
    title:"🖌️ 書道",
    file:"calligraphy.html"
},

{
    key:"music",
    title:"🎵 音楽",
    file:"music.html"
},

{
    key:"home",
    title:"🍳 家庭科",
    file:"home.html"
},

{
    key:"nurse",
    title:"💊 養護",
    file:"nurse.html"
},

{
    key:"office",
    title:"🗂️ 事務",
    file:"office.html"
},

{
    key:"library",
    title:"📚 司書",
    file:"library.html"
},

{
    key:"it",
    title:"💻 情報",
    file:"it.html"
}

];

/* ------------------------
   未クリア課題のみ表示
------------------------ */

function displaySubjects(){

    const clears = JSON.parse(
        localStorage.getItem("clears")
        || "{}"
    );

    const remainingSubjects =
        subjects.filter(
            subject =>
            !clears[subject.key]
        );

    remainingSubjects.sort(
        () => Math.random() - 0.5
    );

    const area =
        document.getElementById(
            "subjectArea"
        );

    area.innerHTML = "";

    if(
        remainingSubjects.length === 0
    ){

        area.innerHTML = `
            <p>
            未クリアの課題はありません。
            </p>
        `;

        return;
    }

    remainingSubjects.forEach(
        subject => {

        area.innerHTML += `
        <button
        onclick="location.href='${subject.file}'">
            ${subject.title}
        </button>
        `;

    });

}

/* ------------------------
   進行状況表示
------------------------ */

function showProgress(){

    const clears = JSON.parse(
        localStorage.getItem("clears")
        || "{}"
    );

    let count = 0;

    let html = "";

    subjects.forEach(subject => {

        const done =
            clears[subject.key];

        if(done){
            count++;
        }

        html += `
        <div class="progress-row">

            <span>
                ${subject.title}
            </span>

            <span>
                ${done ? "✅" : "⬜"}
            </span>

        </div>
        `;

    });

    html += `
    <div class="progress-total">
        達成率 ${count}/8
    </div>
    `;

    document.getElementById(
        "progressArea"
    ).innerHTML = html;
}

/* ------------------------
   キーワード表示
------------------------ */

function showKeywords(){

    const history = JSON.parse(
        localStorage.getItem(
            "keywordHistory"
        ) || "[]"
    );

    let html = "";

    if(
        history.length === 0
    ){

        html =
        "<p>まだ取得していません</p>";

    }else{

        history.forEach(char => {

            html += `
            <span class="keyword owned">
                ${char}
            </span>
            `;

        });

    }

    document.getElementById(
        "keywordArea"
    ).innerHTML = html;
}

/* ------------------------
   最後の課題
------------------------ */

function checkFinal(){

    const word =
        document.getElementById(
            "finalInput"
        )
        .value
        .trim();

    if(
        word === "最後の課題" ||
        word === "さいごのかだい"
    ){

        location.href =
            "final.html";

        return;
    }

    alert(
        "「最後の課題」と入力してください。"
    );
}

/* ------------------------
   タイマー
------------------------ */

function updateTimer(){

    const start =
        Number(
            localStorage.getItem(
                "startTime"
            )
        );

    if(!start){
        return;
    }

    const sec =
        Math.floor(
            (Date.now() - start)
            / 1000
        );

    const min =
        Math.floor(sec / 60);

    const remain =
        sec % 60;

    document.getElementById(
        "timer"
    ).textContent =
        `経過時間 ${min}分${remain}秒`;

}

/* ------------------------
   初期化
------------------------ */

displaySubjects();
showProgress();
showKeywords();

updateTimer();

setInterval(
    updateTimer,
    1000
);

</script>

</body>
</html>
