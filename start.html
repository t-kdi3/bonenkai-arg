<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<title>教科横断チャレンジ</title>
</head>

<body>

<div class="container">

<div class="page-card">

<h1>教科横断チャレンジ</h1>

<p>

挑戦する課題名を入力してください。

</p>

<input
id="search"
placeholder="例：音楽からの課題">

<button onclick="movePage()">
検索
</button>

<div
id="timer"
class="timer">
</div>

<hr>

<h3>

課題一覧

</h3>

<div class="challenge-list">

音楽からの課題<br>
美術からの課題<br>
書道からの課題<br>
家庭からの課題<br>
情報からの課題<br>
養護からの課題<br>
司書からの課題<br>
事務からの課題

</div>

<hr>

<h3>

課題達成状況

</h3>

<div
id="status"
class="status">
</div>

<hr>

<h3>

取得した手がかり

</h3>

<div
id="keywords"
class="status">
</div>

</div>

</div>

<script>

const pageMap = {

    "音楽からの課題":
        "music.html",

    "美術からの課題":
        "art.html",

    "書道からの課題":
        "calligraphy.html",

    "家庭からの課題":
        "home.html",

    "情報からの課題":
        "it.html",

    "養護からの課題":
        "nurse.html",

    "司書からの課題":
        "library.html",

    "事務からの課題":
        "office.html"

};

const challengeNames = {

    music:"音楽からの課題",
    art:"美術からの課題",
    calligraphy:"書道からの課題",
    home:"家庭からの課題",
    it:"情報からの課題",
    nurse:"養護からの課題",
    library:"司書からの課題",
    office:"事務からの課題"

};

const keywords = {

    music:"ボ",
    art:"ウ",
    calligraphy:"ネ",
    home:"ン",
    it:"カ",
    nurse:"イ",
    library:"タ",
    office:"ノ"

};

const subjects = [

    "music",
    "art",
    "calligraphy",
    "home",
    "it",
    "nurse",
    "library",
    "office"

];

/* ------------------
   ページ移動
------------------ */

function movePage(){

    const word =
    document
    .getElementById(
        "search"
    )
    .value
    .trim();

    if(pageMap[word]){

        location.href =
        pageMap[word];

        return;

    }

    if(
        word ===
        "ボウネンカイタノシイ"
    ){

        if(allClear()){

            location.href =
            "final.html";

        }else{

            alert(
                "すべての課題を達成してから挑戦してください。"
            );

        }

    }

}

/* ------------------
   全達成判定
------------------ */

function allClear(){

    return subjects.every(subject =>

        localStorage.getItem(
            "clear_" + subject
        )

    );

}

/* ------------------
   進捗表示
------------------ */

function updateStatus(){

    let clearCount = 0;

    let statusHtml = "";

    let keywordHtml = "";

    subjects.forEach(subject=>{

        const cleared =
        localStorage.getItem(
            "clear_" + subject
        );

        if(cleared){

            clearCount++;

            statusHtml +=
                "✅ "
                +
                challengeNames[
                    subject
                ]
                +
                "<br>";

            keywordHtml +=
                "【"
                +
                keywords[
                    subject
                ]
                +
                "】 ";

        }else{

            statusHtml +=
                "⬜ "
                +
                challengeNames[
                    subject
                ]
                +
                "<br>";

        }

    });

    statusHtml +=
        "<hr>" +
        "<strong>" +
        clearCount +
        " / 8 達成" +
        "</strong>";

    if(clearCount === 8){

        statusHtml +=
        "<br><br>" +
        "すべての課題を達成しました。<br>" +
        "取得した手がかりを組み合わせ、<br>" +
        "検索欄へ入力してください。";

    }

    document
    .getElementById(
        "status"
    )
    .innerHTML =
    statusHtml;

    document
    .getElementById(
        "keywords"
    )
    .innerHTML =

        keywordHtml ||
        "まだ取得していません。";

}

updateStatus();

/* ------------------
   タイマー
------------------ */

setInterval(()=>{

    const startTime =
    localStorage.getItem(
        "startTime"
    );

    if(!startTime){

        return;

    }

    const elapsed =

    Math.floor(

        (Date.now() -
        Number(startTime))

        / 1000

    );

    const min =
    Math.floor(
        elapsed / 60
    );

    const sec =
    elapsed % 60;

    document
    .getElementById(
        "timer"
    )
    .innerHTML =

        "経過時間：" +
        min +
        "分 " +
        sec +
        "秒";

},1000);

/* ------------------
   Enterキー対応
------------------ */

document
.getElementById(
    "search"
)
.addEventListener(
"keypress",
function(e){

    if(
        e.key ===
        "Enter"
    ){

        movePage();

    }

});

</script>

</body>
</html>
