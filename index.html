<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<title>教科横断チャレンジ</title>

</head>

<body>

<div class="container">

<div class="page-card">

<h1>教科横断チャレンジ</h1>

<p>

各分野から出題される課題に挑戦し、
最後のキーワードを導き出してください。

</p>

<p>

課題を解決すると、
最終課題につながる手がかりを得ることができます。

</p>

<hr>

<p>
まず、お名前を入力してください。<br>
<input
    type="text"
    id="personalName"
    placeholder="お名前を入力">
</p>

<p>

開始する場合は、

<strong>スタート</strong>

と入力してください。

</p>

<input
id="startWord"
placeholder="こちらに入力">

<button onclick="startGame()">

開始する

</button>

<section id="debugPanel" class="debug-panel" hidden>
    <h2>企画者用デバッグ</h2>
    <p>
        この端末に保存された課題の回答・クリア状況とキーワード収集状況をリセットします。
    </p>
    <button id="resetProgressButton" type="button">
        進行状況をリセット
    </button>
    <p id="debugStatus" role="status" aria-live="polite"></p>
</section>

</div>

</div>

<script>

function startGame(){

    const personalName =
        document.getElementById(
            "personalName"
        ).value.trim();

    if(personalName === ""){
        alert("お名前を入力してください。");
        return;
    }

    const word =
        document.getElementById(
            "startWord"
        ).value.trim();

    localStorage.setItem(
        "personalName",
        personalName
    );

    if(word === "スタート"){

        localStorage.setItem(
            "startTime",
            Date.now()
        );

        localStorage.removeItem(
            "scoreSent"
        );

        location.href = "start.html";
        return;
    }

    alert(
        "「スタート」と入力してください。"
    );
}

document
.getElementById("startWord")
.addEventListener(
"keypress",
function(e){

    if(e.key === "Enter"){

        startGame();

    }

});

if(new URLSearchParams(location.search).get("debug") === "1"){
    const debugPanel = document.getElementById("debugPanel");
    debugPanel.hidden = false;

    document
    .getElementById("resetProgressButton")
    .addEventListener("click", function(){
        if(!confirm("この端末の課題進行状況とキーワードをリセットしますか？")){
            return;
        }

        [
            "clears",
            "keywordHistory",
            "artProgress",
            "itAttempts",
            "startTime"
        ].forEach(key => localStorage.removeItem(key));

        document.getElementById("debugStatus").textContent =
            "進行状況をリセットしました。通常の開始手順から再テストできます。";
    });
}

</script>

</body>
</html>
