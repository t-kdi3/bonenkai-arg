<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff6f61">

<title>文化祭ナゾトキラリー</title>

css/style.css

</head>

<body>

<div class="container">

    <div class="page-card">

        <div style="font-size:2rem;">
            🎊🎪🎊
        </div>

        <h1>
            文化祭ナゾトキラリー
        </h1>

        <p>
            ようこそ、文化祭ナゾトキラリーへ！
        </p>

        <p>
            あなたたちはナゾトキ調査隊です。
        </p>

        <p>
            校内に散らばる8つの挑戦をクリアし、
            最後のキーワードを見つけ出してください。
        </p>

        <hr>

        <h3>
            参加方法
        </h3>

        <ol style="text-align:left; max-width:500px; margin:auto;">
            <li>司会者の合図を待つ</li>
            <li>検索欄に「スタート」と入力</li>
            <li>各教科の挑戦をクリアする</li>
            <li>8文字のキーワードを集める</li>
            <li>最後の答えを導き出す</li>
        </ol>

        <br>

        <input
            id="startWord"
            placeholder="ここに入力">

        <button onclick="startGame()">
            ゲーム開始
        </button>

        <p style="margin-top:20px;color:#666;">
            ※司会者の合図後にスタートしてください
        </p>

    </div>

</div>

<script>

function startGame(){

    const word =
    document.getElementById(
        "startWord"
    ).value.trim();

    if(word === "スタート"){

        localStorage.setItem(
            "startTime",
            Date.now()
        );

        location.href = "start.html";

    }else{

        alert(
            "「スタート」と入力してください"
        );

    }

}

document
.getElementById("startWord")
.addEventListener("keypress", function(e){

    if(e.key === "Enter"){

        startGame();

    }

});

</script>

</body>
</html>
