<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<title>教科横断チャレンジ</title>

</head>

<body>

<div class="container">

<div class="page-card">

<h1>教科横断チャレンジ</h1>

<p>

各分野から出題される課題に挑戦し、
最後のキーワードを導き出してください。

</p>

<p>

課題を解決すると、
最終課題につながる手がかりを得ることができます。

</p>

<hr>

<p>
まず、お名前を入力してください。<br>
<input
    type="text"
    id="personalName"
    placeholder="お名前を入力">
</p>

<p>

開始する場合は、

<strong>スタート</strong>

と入力してください。

</p>

<input
id="startWord"
placeholder="こちらに入力">

<button onclick="startGame()">

開始する

</button>

</div>

</div>

<script>

function startGame(){

    const personalName =
        document.getElementById(
            "personalName"
        ).value.trim();

    if(personalName === ""){
        alert("お名前を入力してください。");
        return;
    }

    const word =
        document.getElementById(
            "startWord"
        ).value.trim();

    localStorage.setItem(
        "personalName",
        personalName
    );

    if(word === "スタート"){

        localStorage.setItem(
            "startTime",
            Date.now()
        );

        localStorage.removeItem(
            "scoreSent"
        );

        location.href = "start.html";
        return;
    }

    if(word === "デバッグ"){

        localStorage.clear();

        localStorage.setItem(
            "personalName",
            personalName
        );

        localStorage.setItem(
            "startTime",
            Date.now()
        );

        location.href = "start.html";
        return;
    }

    alert(
        "「スタート」と入力してください。"
    );
}

document
.getElementById("startWord")
.addEventListener(
"keypress",
function(e){

    if(e.key === "Enter"){

        startGame();

    }

});

</script>

</body>
</html>
